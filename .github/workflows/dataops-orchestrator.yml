name: Build dataops-orchestrator

on:
  push:
    branches:
      - main
    paths:
      - "dataops-orchestrator/**"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/dataops-orchestrator

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The GHA layer cache below needs a buildx builder (the runner's default `docker` driver cannot export one).
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dataops-orchestrator
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Without a cache every CI build recreates the dependency layer from scratch, which gives it a new
          # digest even though requirements.txt did not change, so every deploy pulls those ~40 MB again.
          # With it the layer is reused and a deploy only pulls the small app layer on top.
          cache-from: type=gha
          cache-to: type=gha,mode=max
