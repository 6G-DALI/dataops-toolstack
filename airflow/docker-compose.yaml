# Cap container logs so they don't grow unbounded: keep a single 5 MB json-file.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

x-airflow-common:
  &airflow-common
  logging: *default-logging
  # In order to add custom dependencies or upgrade provider distributions you can use your extended image.
  # Comment the image line, place your Dockerfile in the directory where you placed the docker-compose.yaml
  # and uncomment the "build" line below, Then run `docker-compose build` to build the images.
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:3.1.8}
  # build: .
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow}@postgres/${POSTGRES_DB:-airflow}
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    # yamllint disable rule:line-length
    # Use simple http server on scheduler for health checks
    # See https://airflow.apache.org/docs/apache-airflow/stable/administration-and-deployment/logging-monitoring/check-health.html#scheduler-health-check-server
    # yamllint enable rule:line-length
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # WARNING: Use _PIP_ADDITIONAL_REQUIREMENTS option ONLY for a quick checks
    # for other purpose (development, test and especially production usage) build/extend Airflow image.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    # The following line can be used to set a custom config file, stored in the local config folder
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags:z
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs:z
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config:z
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins:z
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    logging: *default-logging
    expose:
      - 5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow}
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    logging: *default-logging
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "19999:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      # yamllint disable rule:line-length
      test: ["CMD-SHELL", 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      <<: *airflow-common-env
      # Required to handle warm shutdown of the celery workers properly
      # See https://airflow.apache.org/docs/docker-stack/entrypoint.html#signal-propagation
      DUMB_INIT_SETSID: "0"
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    # yamllint disable rule:line-length
    command:
      - -c
      - |
        if [[ -z "${AIRFLOW_UID}" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"
          echo "If you are on Linux, you SHOULD follow the instructions below to set "
          echo "AIRFLOW_UID environment variable, otherwise files will be owned by root."
          echo "For other operating systems you can get rid of the warning with manually created .env file:"
          echo "    See: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#setting-the-right-airflow-user"
          echo
          export AIRFLOW_UID=$$(id -u)
        fi
        one_meg=1048576
        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))
        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)
        disk_available=$$(df / | tail -1 | awk '{print $$4}')
        warning_resources="false"
        if (( mem_available < 4000 )) ; then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo "At least 4GB of memory required. You have $$(numfmt --to iec $$((mem_available * one_meg)))"
          echo
          warning_resources="true"
        fi
        if (( cpus_available < 2 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo "At least 2 CPUs recommended. You have $${cpus_available}"
          echo
          warning_resources="true"
        fi
        if (( disk_available < one_meg * 10 )); then
          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo "At least 10 GBs recommended. You have $$(numfmt --to iec $$((disk_available * 1024 )))"
          echo
          warning_resources="true"
        fi
        if [[ $${warning_resources} == "true" ]]; then
          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow (see above)!\e[0m"
          echo "Please follow the instructions to increase amount of resources available:"
          echo "   https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html#before-you-begin"
          echo
        fi
        echo
        echo "Creating missing opt dirs if missing:"
        echo
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Airflow version:"
        /entrypoint airflow version
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Running airflow config list to create default config file if missing."
        echo
        /entrypoint airflow config list >/dev/null
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Change ownership of files in /opt/airflow to ${AIRFLOW_UID}:0"
        echo
        chown -R "${AIRFLOW_UID}:0" /opt/airflow/
        echo
        echo "Change ownership of files in shared volumes to ${AIRFLOW_UID}:0"
        echo
        chown -v -R "${AIRFLOW_UID}:0" /opt/airflow/{logs,dags,plugins,config}
        echo
        echo "Files in shared volumes:"
        echo
        ls -la /opt/airflow/{logs,dags,plugins,config}
    # yamllint enable rule:line-length
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    # Workaround for entrypoint issue. See: https://github.com/apache/airflow/issues/16252
    command:
      - bash
      - -c
      - airflow
    depends_on:
      <<: *airflow-common-depends-on

  # You can enable flower by adding "--profile flower" option e.g. docker-compose --profile flower up
  # or by explicitly targeted on the command line e.g. docker-compose up flower.
  # See: https://docs.docker.com/compose/profiles/
  flower:
    <<: *airflow-common
    command: celery flower
    profiles:
      - flower
    ports:
      - "19998:5555"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:5555/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  dataops-orchestrator:
    image: ghcr.io/6g-dali/dataops-orchestrator:latest
    restart: always
    ports:
      - "19997:8000"
    environment:
      # --- Airflow API access ---
      AIRFLOW_URL: http://airflow-apiserver:8080
      AIRFLOW_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      AIRFLOW_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      CORS_ORIGINS: ${DATAOPS_CORS_ORIGINS:-http://localhost:3000}
      # --- Generated DAG/task/plugin locations (inside the container) ---
      AIRFLOW_DAGS_FOLDER: /srv/data/dags
      AIRFLOW_TASKS_FOLDER: /srv/data/tasks
      AIRFLOW_PLUGINS_FOLDER: /opt/airflow/plugins
      # --- piveau search / data space discovery ---
      PIVEAU_URL: ${PIVEAU_URL:-https://search.dspace.sparkworks.net}
      DSPACE_URL: ${DSPACE_URL:-https://dspace.sparkworks.net/datasets}
      DSPACE_CATALOGUE_URL: ${DSPACE_CATALOGUE_URL:-https://catalogue.dspace.sparkworks.net}
      # --- piveau-hub write API (service registration) ---
      PIVEAU_HUB_URL: ${PIVEAU_HUB_URL:-https://dspace.sparkworks.net}
      PIVEAU_API_KEY: ${PIVEAU_API_KEY:-}
      PIVEAU_SERVICES_CATALOGUE: ${PIVEAU_SERVICES_CATALOGUE:-6g-dali-services}
      DSPACE_BASE_URL: ${DSPACE_BASE_URL:-https://dataspace.6gdali.eu}
      CODE_REPOSITORY_URL: ${CODE_REPOSITORY_URL:-https://github.com/6G-DALI/6gdali-dataops}
      PUBLISHER_NAME: ${PUBLISHER_NAME:-6G-DALI}
      ORCHESTRATOR_URL: ${ORCHESTRATOR_URL:-http://localhost:19997}
      DATASPACE_S3_ENDPOINT_URL: http://sparks-prod07.sparkworks.net:9000
      DATASPACE_S3_ACCESS_KEY: zfJrryNaSXUcojp2Ldj6
      DATASPACE_S3_SECRET_KEY: 0uilHRp2z6CKEqIA98mkY97HUcRIHuQU8xZyvClJ
      VALIDATION_DAG_ID: dali_dataspace_validate_dataset
      EDC_PROVIDER_MANAGEMENT_URL: "http://edc.6gdali.sparkworks.net:20001/management"
      EDC_CONNECTOR_URL: "http://edc.6gdali.sparkworks.net"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/dags:/srv/data/dags:z
      - ${AIRFLOW_PROJ_DIR:-.}/dags/tasks:/srv/data/tasks:z
      - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins:z
    depends_on:
      airflow-apiserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s


  dataops-ui:
    # Image published by .github/workflows/dataops-ui.yml. Uncomment `build` to
    # use a local checkout instead.
    image: ghcr.io/6g-dali/dataops-ui:${DATAOPS_UI_TAG:-latest}
    # build:
    #   context: ../dataops-ui
    restart: always
    logging: *default-logging
    environment:
      # Read at container start by 40-dataops-config.sh, which regenerates
      # config.js — no rebuild needed. Anything left unset keeps the value baked
      # into the image.
      #
      # IMPORTANT: these are consumed by the BROWSER, not by this container, so
      # they must be reachable from the user's machine. `http://dataops-orchestrator:8000`
      # would resolve only inside the compose network and fail in the browser.
      VITE_ORCHESTRATOR_URL: ${DATAOPS_ORCHESTRATOR_URL:-/api}
      VITE_CATALOGUE_BASE_URL: ${DATAOPS_CATALOGUE_BASE_URL:-}
      VITE_PORTAL_URL: ${DATAOPS_PORTAL_URL:-}
      VITE_DALI_URL: ${VITE_DALI_URL:-}
      VITE_DATASPACE_URL: ${VITE_DATASPACE_URL:-}
      VITE_DATAOPS_URL: ${VITE_DATAOPS_URL:-}
      VITE_MLOPS_URL: ${VITE_MLOPS_URL:-}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-}
      VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-}
      # Substituted into the nginx CSP at start-up. Scheme + host, no path.
      # Both must be set or the browser blocks the calls with only a console
      # CSP violation to show for it.
      KEYCLOAK_ORIGIN: ${KEYCLOAK_ORIGIN:-https://auth.dspace.sparkworks.net}
      # Internal address nginx proxies /api to. Resolved on the compose network,
      # so the orchestrator needs no published port at all.
      ORCHESTRATOR_UPSTREAM: ${DATAOPS_ORCHESTRATOR_UPSTREAM:-http://dataops-orchestrator:8000}
      # Only for deployments that call the API cross-origin instead of via /api.
      ORCHESTRATOR_ORIGIN: ${DATAOPS_ORCHESTRATOR_ORIGIN:-}
    networks:
      - default
      - dali-edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  portal:
    image: ghcr.io/6g-dali/portal-ui:${PORTAL_UI_TAG:-latest}
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Substituted into the nginx CSP at start-up. Scheme + host, no path.
      KEYCLOAK_ORIGIN: ${KEYCLOAK_ORIGIN:-https://auth.dspace.sparkworks.net}
      # Applied at container start by 40-portal-config.sh, which regenerates
      # config.js. Anything left unset keeps the value baked into the image.
      VITE_DALI_URL: ${VITE_DALI_URL:-}
      VITE_PORTAL_URL: ${VITE_PORTAL_URL:-}
      VITE_DATASPACE_URL: ${VITE_DATASPACE_URL:-}
      VITE_DATAOPS_URL: ${VITE_DATAOPS_URL:-}
      VITE_MLOPS_URL: ${VITE_MLOPS_URL:-}
      VITE_REPO_API_URL: ${VITE_REPO_API_URL:-}
      VITE_SEARCH_API_URL: ${VITE_SEARCH_API_URL:-}
      VITE_ORCHESTRATOR_URL: ${VITE_ORCHESTRATOR_URL:-}
      VITE_NORTHBOUND_API_URL: ${VITE_NORTHBOUND_API_URL:-}
      VITE_EDC_CONNECTOR_URL: ${VITE_EDC_CONNECTOR_URL:-}
      VITE_AUTH_URL: ${VITE_AUTH_URL:-}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-}
      # Own variable: the two front ends share a realm but are separate
      # Keycloak clients, so this must not pick up dataops-ui's client id.
      VITE_KEYCLOAK_CLIENT_ID: ${PORTAL_KEYCLOAK_CLIENT_ID:-}
    networks:
      - default
      - dali-edge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Opt-in, so the stack still comes up on hosts with no tunnel token:
    #   docker compose --profile tunnel up -d
    profiles:
      - tunnel
    logging: *default-logging
    # Token-provisioned tunnels are remotely managed: ingress rules live in the
    # Cloudflare Zero Trust dashboard. Point the public hostnames at
    # http://portal:80 and http://dataops-ui:80 there.
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TUNNEL_METRICS: 0.0.0.0:2000
    depends_on:
      portal:
        condition: service_healthy
    networks:
      - default
      - dali-edge


volumes:
  postgres-db-volume:
networks:
  default:
  dali-edge:
    external: true
